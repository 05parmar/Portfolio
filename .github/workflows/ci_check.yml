name: Flutter CI Practice

# 1. When should this run?
on:
  push:
    branches: [ "main", "feature/*" ] # Runs on main and any branch starting with feature/
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 2. What machine should it run on?
    runs-on: ubuntu-latest

    steps:
      # 3. Download the code from your repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 4. Install Flutter on the virtual machine
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # It will use the latest stable 3.x version
          channel: 'stable'

      # 5. Get the packages (like 'flutter pub get')
      - name: Install dependencies
        run: flutter pub get

      # 6. Check for code "smells" or formatting issues
      - name: Analyze code
        run: flutter analyze

      # 7. Run your tests (if you have any in the /test folder)
      - name: Run tests
        run: flutter test