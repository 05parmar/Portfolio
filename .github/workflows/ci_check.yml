name: HTML Portfolio CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: CNode.js
        uses: actions/setup-node@v4
        with:heckout code
        uses: actions/checkout@v4

      # For HTML/CSS, we check for syntax errors (Linting)
      - name: Setup 
          node-version: '20'

      - name: Install HTML Hinter
        run: npm install -g htmlhint

      - name: Check HTML for errors
        run: htmlhint "**/*.html"